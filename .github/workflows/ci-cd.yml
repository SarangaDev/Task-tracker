name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ─────────────────────────────────────────────────────────
# JOB 1 — Backend CI  (install → lint → test → build)
# ─────────────────────────────────────────────────────────
jobs:
  backend-ci:
    name: Backend — Lint, Test & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      # ── Install ─────────────────────────────────────────
      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # ── Lint ────────────────────────────────────────────
      - name: Lint (ESLint)
        working-directory: backend
        run: npm run lint

      # ── Prisma client (required before tests/build) ─────
      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Apply Database Schema
        working-directory: backend
        run: npx prisma db push

      # ── Test ────────────────────────────────────────────
      - name: Run tests (Jest)
        working-directory: backend
        run: npm test

      # ── Build ────────────────────────────────────────────
      - name: TypeScript build
        working-directory: backend
        run: npm run build

  # ─────────────────────────────────────────────────────────
  # JOB 2 — Frontend CI  (install → lint → type-check+build)
  # ─────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend — Lint, Type-check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # ── Install ─────────────────────────────────────────
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # ── Lint ────────────────────────────────────────────
      - name: Lint (ESLint + Vue)
        working-directory: frontend
        run: npm run lint

      # ── Build (vue-tsc type-check is part of build) ─────
      - name: Build (includes vue-tsc type-check)
        working-directory: frontend
        run: npm run build

  # ─────────────────────────────────────────────────────────
  # JOB 3 — Docker build & push  (main branch only)
  # ─────────────────────────────────────────────────────────
  build-and-push:
    name: Docker — Build & Push Images
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend image
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Extract metadata for Frontend image
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
