version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: task_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpassword
      POSTGRES_DB: tasktracker
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskuser -d tasktracker']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: task_tracker_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://taskuser:taskpassword@postgres:5432/tasktracker?schema=public
      JWT_SECRET: your-super-secret-jwt-key-change-in-production-min-32-chars
      JWT_EXPIRES_IN: 7d
      PORT: 5000
      NODE_ENV: production
    ports:
      - '5000:5000'

  frontend:
    build: ./frontend
    container_name: task_tracker_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '3000:80'

volumes:
  postgres_data:
